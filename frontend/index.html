<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Production Control &amp; Traceability System (PCTS)</title>
  
  <!-- Modern Typography: Plus Jakarta Sans & JetBrains Mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <!-- ============ LOGIN SCREEN ============ -->
  <div id="login-screen" class="login-screen">
    <!-- Login Screen Theme Toggle -->
    <div class="login-theme-toggle">
      <button id="login-theme-toggle" class="theme-toggle-btn" title="Toggle theme (Light / Dark)" aria-label="Toggle theme">
        <svg class="theme-sun" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="5"></circle>
          <line x1="12" y1="1" x2="12" y2="3"></line>
          <line x1="12" y1="21" x2="12" y2="23"></line>
          <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
          <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
          <line x1="1" y1="12" x2="3" y2="12"></line>
          <line x1="21" y1="12" x2="23" y2="12"></line>
          <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
          <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
        </svg>
        <svg class="theme-moon" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" hidden>
          <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
        </svg>
      </button>
    </div>

    <div class="login-card">
      <div class="login-brand">
        <div class="login-logo">PCTS</div>
        <h1>Production Control &amp; Traceability</h1>
        <p class="muted">Enterprise Administration &amp; Management &middot; Spec v3.0</p>
      </div>

      <form id="login-form" class="login-form">
        <div class="field">
          <label for="login-username">Username</label>
          <input type="text" id="login-username" placeholder="e.g. admin" autocomplete="username" required />
        </div>
        <div class="field">
          <label for="login-password">Password</label>
          <input type="password" id="login-password" placeholder="&bull;&bull;&bull;&bull;&bull;&bull;&bull;&bull;" autocomplete="current-password" required />
        </div>
        <div id="login-error" class="form-error" hidden></div>
        <button type="submit" class="btn btn-primary btn-block">Sign In to Dashboard</button>
      </form>

      <form id="mfa-form" class="login-form" hidden>
        <p class="muted" style="font-size: 13px; text-align: center;">Enter the 6-digit authentication code from your registered device.</p>
        <div class="field">
          <label for="mfa-code">MFA Verification Code</label>
          <input type="text" id="mfa-code" maxlength="6" inputmode="numeric" placeholder="123456" autocomplete="one-time-code" required />
        </div>
        <div id="mfa-error" class="form-error" hidden></div>
        <button type="submit" class="btn btn-primary btn-block">Verify &amp; Continue</button>
      </form>

      <!-- 1-Click Interactive Demo Accounts Selector -->
      <div class="login-demo">
        <div class="login-demo-header">
          <strong>1-Click Demo Profiles</strong>
          <span>Key: <code>Trenser@2026</code></span>
        </div>
        <div class="demo-chips-grid">
          <button type="button" class="demo-chip-btn" data-username="admin" data-password="Trenser@2026">
            <span class="demo-chip-user">admin</span>
            <span class="demo-chip-role">System Admin</span>
          </button>
          <button type="button" class="demo-chip-btn" data-username="pmanager" data-password="Trenser@2026">
            <span class="demo-chip-user">pmanager</span>
            <span class="demo-chip-role">Production Manager</span>
          </button>
          <button type="button" class="demo-chip-btn" data-username="supervisor" data-password="Trenser@2026">
            <span class="demo-chip-user">supervisor</span>
            <span class="demo-chip-role">Floor Supervisor</span>
          </button>
          <button type="button" class="demo-chip-btn" data-username="qaofficer" data-password="Trenser@2026">
            <span class="demo-chip-user">qaofficer</span>
            <span class="demo-chip-role">QA/QC Officer</span>
          </button>
          <button type="button" class="demo-chip-btn" data-username="maintenance" data-password="Trenser@2026">
            <span class="demo-chip-user">maintenance</span>
            <span class="demo-chip-role">Maintenance Officer</span>
          </button>
          <button type="button" class="demo-chip-btn" data-username="operator1" data-password="Trenser@2026">
            <span class="demo-chip-user">operator1</span>
            <span class="demo-chip-role">Operator</span>
          </button>
        </div>
      </div>
    </div>
  </div>

  <!-- ============ APP SHELL ============ -->
  <div id="app-shell" class="app-shell" hidden>
    <header class="topbar">
      <div class="topbar-left">
        <button id="nav-toggle" class="icon-btn" title="Toggle navigation sidebar" aria-label="Toggle navigation">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="3" y1="12" x2="21" y2="12"></line>
            <line x1="3" y1="6" x2="21" y2="6"></line>
            <line x1="3" y1="18" x2="21" y2="18"></line>
          </svg>
        </button>
        <div class="brand-badge">P</div>
        <div class="topbar-title-wrap">
          <span class="topbar-title">PCTS Enterprise</span>
          <span class="topbar-subtitle">Production Control &amp; Traceability</span>
        </div>
      </div>

      <div class="topbar-search">
        <div class="search-input-wrapper">
          <span class="search-icon">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="11" cy="11" r="8"></circle>
              <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
            </svg>
          </span>
          <input type="text" id="global-search" placeholder="Search orders, batches, machines, defects..." autocomplete="off" />
          <span class="search-kbd-hint">Ctrl K</span>
        </div>
        <div id="search-results" class="search-results" hidden></div>
      </div>

      <div class="topbar-right">
        <!-- Theme Toggle Button -->
        <button id="topbar-theme-toggle" class="theme-toggle-btn" title="Toggle theme (Light / Dark)" aria-label="Toggle theme">
          <svg class="theme-sun" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="5"></circle>
            <line x1="12" y1="1" x2="12" y2="3"></line>
            <line x1="12" y1="21" x2="12" y2="23"></line>
            <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
            <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
            <line x1="1" y1="12" x2="3" y2="12"></line>
            <line x1="21" y1="12" x2="23" y2="12"></line>
            <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
            <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
          </svg>
          <svg class="theme-moon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" hidden>
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
          </svg>
        </button>

        <!-- Notifications Bell -->
        <button id="notif-btn" class="icon-btn" title="Notifications" aria-label="Notifications">
          <svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path>
            <path d="M13.73 21a2 2 0 0 1-3.46 0"></path>
          </svg>
          <span id="notif-count" class="badge-dot" hidden></span>
        </button>
        <div id="notif-panel" class="notif-panel" hidden></div>

        <!-- User Profile Chip -->
        <div class="user-chip" id="user-chip">
          <div class="user-avatar" id="user-avatar">U</div>
          <div class="user-info">
            <span id="user-name">-</span>
            <span id="user-role" class="muted"></span>
          </div>
        </div>

        <!-- Logout Button -->
        <button id="logout-btn" class="btn btn-ghost btn-sm" title="Log out">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
            <polyline points="16 17 21 12 16 7"></polyline>
            <line x1="21" y1="12" x2="9" y2="12"></line>
          </svg>
          Log out
        </button>
      </div>
    </header>

    <div class="app-body">
      <nav id="sidebar" class="sidebar"></nav>
      <div class="main-wrapper">
        <div id="section-subnav" class="section-subnav" hidden>
          <div class="section-subnav-inner">
            <div class="section-subnav-left">
              <span class="section-subnav-icon" id="section-subnav-icon"></span>
              <span class="section-subnav-title" id="section-subnav-title"></span>
            </div>
            <nav class="section-subnav-tabs" id="section-subnav-tabs" aria-label="Section navigation"></nav>
          </div>
        </div>
        <main id="content" class="content"></main>
      </div>
    </div>
  </div>

  <!-- ============ MODAL / TOAST ROOTS ============ -->
  <div id="modal-root"></div>
  <div id="toast-root" class="toast-root"></div>

  <!-- Core Services & Utilities -->
  <script src="js/core/utils.js"></script>
  <script src="js/core/auth.js"></script>
  <script src="js/core/api.js"></script>

  <!-- Reusable UI Components -->
  <script src="js/components/modal.js"></script>
  <script src="js/components/datepicker.js"></script>
  <script src="js/components/toast.js"></script>
  <script src="js/components/table.js"></script>

  <!-- View Modules -->
  <script src="js/views/dashboard.js"></script>
  <script src="js/views/production.js"></script>
  <script src="js/views/resources.js"></script>
  <script src="js/views/quality.js"></script>
  <script src="js/views/monitoring.js"></script>
  <script src="js/views/traceability.js"></script>
  <script src="js/views/admin.js"></script>

  <!-- Application Shell & Router -->
  <script src="js/app.js"></script>
</body>
</html>
